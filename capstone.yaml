run: docker compose up --build
seed: docker compose exec api python -m app.seed
test: docker compose exec api pytest -q
base_url: http://localhost:8000
endpoints:
  health:
    method: GET
    path: /health
  generate:
    method: POST
    path: /v1/generate
    headers:
      - X-API-Key
      - Idempotency-Key
  usage:
    method: GET
    path: /v1/usage
  checkout:
    method: POST
    path: /v1/checkout
  stripe_webhook:
    method: POST
    path: /webhooks/stripe
